name: Deploy Preview — Pull Request

on:
  pull_request:
    branches:
      - main

jobs:
  preview:
    # Ne tourne que sur les PRs depuis le même repo (pas les forks non fiables)
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate config.js
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: node build.js

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          # channelId omis → Firebase génère un canal temporaire par PR
          # Le lien de preview est posté automatiquement en commentaire sur la PR
