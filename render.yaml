services:
  - type: web
    name: sevenz-youtube-proxy
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: YOUTUBE_API_KEY
        sync: false   # à renseigner manuellement dans le dashboard Render
      - key: LASTFM_API_KEY
        sync: false   # clé Last.fm — à renseigner dans le dashboard Render
      - key: TIDAL_CLIENT_ID
        sync: false   # credentials TIDAL — à renseigner dans le dashboard Render
      - key: TIDAL_CLIENT_SECRET
        sync: false
      - key: APP_ORIGINS
        sync: false   # origines autorisées pour le token Spotify (virgules) — vide = liste par défaut du serveur
